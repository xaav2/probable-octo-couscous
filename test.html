<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ma mini-app</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding: 16px;
    }
    button {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px;
    }
  </style>
</head>
<body>
  <h1 id="salut">Chargement…</h1>
  <button id="btn">Envoyer au bot</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();    // dit à Telegram que la page est prête
    tg.expand();   // plein écran

    const user = tg.initDataUnsafe?.user;
    document.getElementById("salut").textContent =
      "Salut " + (user?.first_name ?? "inconnu") + " !";

    document.getElementById("btn").onclick = () => {
      tg.sendData(JSON.stringify({ action: "test", valeur: 42 }));
      // la mini-app se ferme après l'envoi
    };
  </script>
</body>
</html>
